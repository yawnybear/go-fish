<!DOCTYPE html>
<html>
  <head>
    <title>Go Fish</title>
    <meta charset="utf-8">
    <link rel="stylesheet" href="https://unpkg.com/@rolemodel/optics/dist/css/optics.min.css">
    <link rel="stylesheet" href="./styles/sidebar.css">
    <link rel="stylesheet" href="./styles/layout.css">
    <link rel="stylesheet" href="./styles/accordion.css">
    <link rel="stylesheet" href="./styles/side-panel.css">
    <link rel="stylesheet" href="./styles/game-card.css">
  </head>
  <body class="app-with-sidebar">
    <nav class="sidebar sidebar--drawer">
      <a class="sidebar__brand">Go Fish</a>
      <div class="sidebar__content sidebar__content--start">
        <div class="btn btn--active btn--no-border">Games</div>
        <div class="btn btn--no-border">Stats</div>
      </div>
      <div class="sidebar__content sidebar__content--end">
        <div class="divider"></div>
        <div class="btn btn--no-border">Profile</div>
        <div class="btn btn--no-border">Log Out</div>
      </div>
    </nav>
    <div class="app__body">
      <section class="app__content">
        <div class="app__players">
          Players
          <details class="accordion">
            <summary class="accordion__summary">
              <span class="material-symbols-outlined icon accordion__marker">arrow_right</span>
              <span class="summary__label">Player 1</span>
              <span class="summary__label">Cards: 7</span>
              <span class="summary__label">Books: 0</span>
            </summary>
            <div class="accordion__content">
              <div class="game-card game-card--small">A</div>
              <div class="game-card game-card--small">Q</div>
            </div>
          </details>
        </div>
        <div class="app__feed">
          Game Feed
          <div class="side-panel">
            <div class="side-panel__body">
              Scott asks Hunter if they have any 8s
            </div>
            <div class="side-panel__footer">
              <textarea class="form-control" placeholder="Send a message"></textarea>
            </div>
          </div>
        </div>
      </section>
      <footer class="app__footer">
        <span>Hand</span>
        <div class="footer__content">
          <div class="footer__body footer__body--start">
            <div class="game-card game-card--start"></div>
            <div class="game-card game-card--start"></div>
            <div class="game-card game-card--start"></div>
            <div class="game-card game-card--start"></div>
          </div>
          <div class="footer__body footer__body--end">
            <div class="game-card game-card--end">A</div>
            <div class="game-card game-card--end">Q</div>
            <div class="game-card game-card--end">3</div>
          </div>
        </div>
      </footer>
    </div>
  </body>
</html>
