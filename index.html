<!DOCTYPE html>
<html>
  <head>
    <title>Go Fish</title>
    <meta charset="utf-8">
    <link rel="stylesheet" href="https://unpkg.com/@rolemodel/optics/dist/css/optics.min.css">
    <link rel="stylesheet" href="./styles/application.css">
  </head>
  <body class="gf-body">
    <section class="gf-section gf-section__game-board">
      <div class="gf-section__header">
        <button class="btn btn--icon btn--primary btn--pill btn--no-border"><span class="material-symbols-outlined icon">arrow_back</span></button>
        <span>Game Board</span> 
      </div>
      <div class="gf-section__body gf-section__body--expanded">
        <span>Players</span>
        <details class="accordion">
          <summary>
            <span class="btn btn--icon btn--small btn--pill btn--no-border"><span class="material-symbols-outlined icon accordion__marker">arrow_right</span></span>
            <span class="accordion__label">Name</span>
            <span class="accordion__label">Cards: #</span>
            <span class="accordion__label">Books: #</span>
          </summary>
          <div class="accordion__content">
            Test
          </div>
        </details>
      </div>
    </section>
    <section class="gf-section gf-section__game-feed">
      <div class="gf-section__header gf-section__header--space-between">
        <span>Game Feed</span>
        <span class="badge badge--primary">Your Turn</span> 
      </div>
      <div class="gf-section__body gf-section__body--space-between">
         <!-- CONTENT HERE -->
      </div>
    </section>
    <section class="gf-section gf-section__your-hand">
      <div class="gf-section__header gf-section__header--condensed">
        <span>Your Hand</span> 
      </div>
      <div class="gf-section__body">
         <!-- CONTENT HERE -->
      </div>
    </section>
    <section class="gf-section gf-section--neutral">
      <div class="gf-section__header gf-section__header--condensed">
        <span>Books</span> 
      </div>
      <div class="gf-section__body">
         <!-- CONTENT HERE -->
      </div>
    </section>
  </body>
</html>
