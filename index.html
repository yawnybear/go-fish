<!DOCTYPE html>
<html>
  <head>
    <title>Go Fish</title>
    <meta charset="utf-8">
    <link rel="stylesheet" href="https://unpkg.com/@rolemodel/optics/dist/css/optics.min.css">
    <link rel="stylesheet" href="./styles/application.css">
  </head>
  <body class="app__body">
    <section class="section section--game-board">
      <div class="section__header section__header--expanded">
        <button class="btn btn--icon btn--pill btn--no-border"><span class="material-symbols-outlined icon">arrow_back</span></button>
        <span>Game Board</span> 
      </div>
      <div class="section__body section__body--expanded">
        <span>Players</span>
        <details class="accordion">
          <summary>
            <span class="btn btn--icon btn--small btn--pill btn--no-border"><span class="material-symbols-outlined icon accordion__marker">arrow_right</span></span>
            <span class="accordion__label">Dominic</span>
            <span class="accordion__label">Cards: 7</span>
            <span class="accordion__label">Books: 2</span>
          </summary>
          <div class="accordion__content">
            <!-- CONTENT HERE -->
          </div>
        </details>
      </div>
    </section>
    <section class="section section--game-feed">
      <div class="section__header section__header--expanded section__header--x-space-between">
        <span>Game Feed</span>
        <span class="badge badge--primary">Your Turn</span> 
      </div>
      <div class="section__body">
        <span class="player-action">Jullian Asked Dominic for any 8s</span>
        <div class="game-response-container">
          <span class="material-symbols-outlined icon">subdirectory_arrow_right</span>
          <span class="game-response game-response--warning">Go Fish: Dominic doesn’t have any 8s</span>
        </div>
        <div class="game-response-container">
          <span class="material-symbols-outlined icon">subdirectory_arrow_right</span>
          <span class="game-response">You drew a 7 of Diamonds</span>
        </div>
        
      </div>
      <div class="section__footer">
        <div class="game-actions"> 
          <div class="game-actions__options">
            <div class="form-group">
              <label class="form-label" for="player">Player</label>
              <select class="form-control form-control--small" name="player">
                <option>Jullian</option>
                <option>Dominic</option>
                <option>Gabriel</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="card-rank">Card Rank</label>
              <select class="form-control form-control--small" name="card-rank">
                <option>Ace</option>
                <option>Two</option>
                <option>Three</option>
                <option>Four</option>
                <option>Five</option>
                <option>Six</option>
                <option>Seven</option>
                <option>Eight</option>
                <option>Nine</option>
                <option>Ten</option>
                <option>Jack</option>
                <option>Queen</option>
                <option>King</option>
              </select>
            </div>
          </div>
          <button class="btn btn--primary btn--small">Ask Gabriel for Sevens</button>
        </div> 
      </div>
    </section>
    <section class="section section--your-hand">
      <div class="section__header">
        <span>Your Hand</span> 
      </div>
      <div class="section__body">
         <!-- CONTENT HERE -->
      </div>
    </section>
    <section class="section section--books">
      <div class="section__header">
        <span>Books</span> 
      </div>
      <div class="section__body">
         <!-- CONTENT HERE -->
      </div>
    </section>
  </body>
</html>
